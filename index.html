<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Content-Security-Policy: scripts only from this site (no inline scripts or
       inline event handlers), network calls only to the n8n server.
       style-src allows 'unsafe-inline' because html5-qrcode injects inline styles. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src https://cstep-n8n.york.cuny.edu; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>CSTEP / STEP Attendance Scanner</title>
  <link rel="stylesheet" href="style.css?v=11" />
</head>
<body>
  <div class="container">
    <header>
      <h1>CSTEP / STEP Attendance Scanner</h1>
    </header>

    <main>

      <!-- ── PASSCODE PANEL (shown first if no passcode is saved) ── -->
      <form id="passcodePanel" class="hidden" novalidate>
        <p class="setup-intro">Enter the staff passcode to use the scanner.</p>

        <div class="form-group">
          <label for="passcodeInput">Staff passcode</label>
          <input type="password" id="passcodeInput" autocomplete="current-password" />
        </div>

        <div id="passcodeError" class="status-message error hidden"></div>
        <button type="submit" id="savePasscodeBtn" class="btn btn-primary">Save</button>
      </form>

      <!-- ── SETUP PANEL (shown once a passcode is saved) ── -->
      <div id="setupPanel" class="hidden">
        <p class="setup-intro">Choose today's event and session to begin.</p>

        <!-- Eventbrite Event -->
        <div class="form-group">
          <label for="eventSelect">Event</label>
          <div class="select-refresh-row">
            <select id="eventSelect" disabled>
              <option value="">Loading today's events...</option>
            </select>
            <button type="button" id="refreshEventsBtn" class="btn-small">Refresh</button>
          </div>
          <p id="eventListStatus" class="form-help">Loading today's Eventbrite events...</p>
        </div>

        <!-- Agenda Session -->
        <div class="form-group">
          <label for="sessionSelect">Session</label>
          <select id="sessionSelect" disabled>
            <option value="">— Select an event first —</option>
          </select>
          <p id="sessionStatus" class="form-help"></p>
        </div>


        <div id="setupError" class="status-message error hidden"></div>
        <button id="confirmSetupBtn" class="btn btn-primary">Confirm &amp; Start Scanning</button>
      </div>

      <!-- ── SCANNER PANEL (shown after setup) ── -->
      <div id="scannerPanel" class="hidden">

        <!-- Active session summary -->
        <div class="session-summary">
          <div class="session-row">
            <span class="session-label">Event:</span>
            <span id="summaryEvent"></span>
          </div>
          <div class="session-row">
            <span class="session-label">Session:</span>
            <span id="summarySession"></span>
          </div>
        </div>

        <!-- Switch to a different event / session -->
        <button id="changeSetupBtn" class="btn btn-change">Change Event / Session</button>

        <!-- Scanner Controls -->
        <div class="scanner-controls">
          <button id="startBtn" class="btn btn-primary">Start Scanner</button>
          <button id="stopBtn" class="btn btn-secondary" disabled>Stop Scanner</button>
        </div>

        <!-- Camera / QR Area -->
        <div id="scannerWrapper" class="scanner-wrapper hidden">
          <div id="qr-reader"></div>
          <p class="scanner-hint">Point the camera at a student QR code</p>
        </div>

        <!-- Status / Result Area -->
        <div id="statusArea" class="status-area hidden">
          <div id="statusMessage" class="status-message"></div>
        </div>

        <!-- Last Scan Info -->
        <div id="lastScan" class="last-scan hidden">
          <h3>Last Scan</h3>
          <div id="lastScanDetails"></div>
        </div>

      </div>

    </main>

    <footer>
      <p>CSTEP / STEP Attendance System &mdash; Scanner Page</p>
      <p><button type="button" id="changePasscodeBtn" class="link-button hidden">Change passcode / log out</button></p>
    </footer>
  </div>

  <!-- html5-qrcode 2.3.8, self-hosted (source: https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js) -->
  <script src="vendor/html5-qrcode.min.js"></script>
  <script src="script.js?v=11"></script>
</body>
</html>
